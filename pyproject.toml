[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "media-mix-ai-lab"
version = "0.1.0"
description = "An experimental AI-assisted Media Mix Modeling workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.45,<2", "plotly>=6,<7", "pandas>=2.2,<3", "numpy>=2,<3",
  "statsmodels>=0.14,<0.15", "scipy>=1.15,<2", "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
